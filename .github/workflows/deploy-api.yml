name: Deploy API (Azure)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "prompts/**"
      - "Dockerfile"
      - "InvoiSys.slnx"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  IMAGEM: ghcr.io/douglas-dev404/invoisys-api
  AZURE_WEBAPP_NAME: invoisys-api-squad78

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGEM }}:${{ github.sha }}
            ${{ env.IMAGEM }}:latest

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.IMAGEM }}:${{ github.sha }}

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -sf "https://${AZURE_WEBAPP_NAME}.azurewebsites.net/health"; then exit 0; fi
            sleep 10
          done
          echo "API não respondeu /health em 5 minutos" && exit 1
