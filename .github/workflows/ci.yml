name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore InvoiSys.slnx

      # --no-restore em todos os passos seguintes: o restore acima já rodou, repetir
      # só gasta tempo de CI.
      - name: Build
        run: dotnet build InvoiSys.slnx --no-restore --configuration Release

      - name: Format check
        run: dotnet format InvoiSys.slnx --verify-no-changes --no-restore

      - name: Testes
        run: dotnet test InvoiSys.slnx --no-build --configuration Release --verbosity normal

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
