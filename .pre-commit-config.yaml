# pre-commit — equivalente Python ao Husky (hooks de git). Projeto é Python puro,
# não usa Node/npm, então Husky (que vive em package.json) não se aplica aqui;
# pre-commit cumpre o mesmo papel: hooks de commit E de push instalados via git.
#
# Setup (uma vez por clone):
#   pip install -e ".[dev]"
#   pre-commit install                          # hook de commit: lint + format
#   pre-commit install --hook-type pre-push      # hook de push: build limpo (testes)
#
# A partir daí: todo `git commit` roda lint/format; todo `git push` roda a suíte de
# testes completa e bloqueia o push se algo quebrar.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: pytest-build-limpo
        name: pytest (build limpo antes do push)
        entry: pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
