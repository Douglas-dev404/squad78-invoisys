services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      # Host "db" é o nome do serviço na rede do compose, não localhost: dentro do
      # container, localhost seria o próprio container da API.
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-invoisys};Username=${POSTGRES_USER:-invoisys};Password=${POSTGRES_PASSWORD:-invoisys}
      # O compose é ambiente descartável: o banco sobe vazio a cada `up -d` com volume
      # novo, então a API aplica as migrations sozinha. Em produção isso fica desligado
      # (padrão do appsettings) e a migration é passo próprio do deploy.
      Database__MigrarAoIniciar: "true"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-invoisys}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invoisys}
      POSTGRES_DB: ${POSTGRES_DB:-invoisys}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - invoisys_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-invoisys} -d ${POSTGRES_DB:-invoisys}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  invoisys_db_data:
