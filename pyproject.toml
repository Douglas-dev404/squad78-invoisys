[project]
name = "invoisys-release-notes"
version = "0.1.0"
description = "Gerador inteligente de Release Notes via IA a partir do Jira — Squad 78, Residência IV InvoiSys."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "jinja2>=3.1.4",
    "python-dotenv>=1.0.1",
    "loguru>=0.7.2",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
# LangChain fica opcional até o LLM provider ser decidido — evita instalar peso morto
# enquanto o pipeline roda contra ProviderPendente. Ver documentação interna de estado do projeto.
llm = [
    "langchain>=0.3.0",
    "tiktoken>=0.8.0",
]
pdf = [
    "weasyprint>=62.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
